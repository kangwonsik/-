<!DOCTYPE html>
<html>
  <head>
    <title>로그인</title>
  </head>
  <body>
    <h1>로그인</h1>
    <form id="loginForm">
      ID: <input type="text" id="id" required><br>
      비밀번호: <input type="password" id="password" required><br>
      메시지: <textarea id="message"></textarea><br>
      <input type="submit" value="로그인">
    </form>
    <div id="result"></div>

    <script>
      document.getElementById('loginForm').onsubmit = function(event) {
        event.preventDefault();
        
        var id = document.getElementById('id').value;
        var password = document.getElementById('password').value;
        var message = document.getElementById('message').value;

        var url = '/exec';
        var params = {
          'id': id,
          'password': password,
          'message': message
        };

        var options = {
          'method': 'post',
          'payload': params
        };

        fetch(url, options)
          .then(response => response.text())
          .then(result => document.getElementById('result').innerText = result)
          .catch(error => document.getElementById('result').innerText = "오류 발생: " + error);
      };
    </script>
  </body>
</html>
