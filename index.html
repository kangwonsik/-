  <script>
        let allData = [];
        let currentRecordCount = 0;
        let isLoading = false;

        const defaultConfig = {
            system_title: "기초학력보장 지원사업",
            teacher_button_text: "담임용",
            admin_button_text: "업무담당자용"
        };

        const dataHandler = {
            onDataChanged(data) {
                allData = data;
                currentRecordCount = data.length;
                renderImprovementTable();
                renderTestTable();
                renderStudentTable();
                renderStandardsTable();
            }
        };

        async function initializeApp() {
            if (window.dataSdk) {
                const initResult = await window.dataSdk.init(dataHandler);
                if (!initResult.isOk) {
                    console.error("데이터 SDK 초기화 실패");
                }
            }

            if (window.elementSdk) {
                await window.elementSdk.init({
                    defaultConfig,
                    onConfigChange: async (config) => {
                        document.getElementById('system-title').textContent = config.system_title || defaultConfig.system_title;
                        document.getElementById('teacher-btn').textContent = config.teacher_button_text || defaultConfig.teacher_button_text;
                        document.getElementById('admin-btn').textContent = config.admin_button_text || defaultConfig.admin_button_text;
                    },
                    mapToCapabilities: (config) => ({
                        recolorables: [
                            {
                                get: () => config.primary_color || "#2563eb",
                                set: (value) => {
                                    config.primary_color = value;
                                    window.elementSdk.setConfig({ primary_color: value });
                                }
                            }
                        ],
                        borderables: [],
                        fontEditable: undefined,
                        fontSizeable: undefined
                    }),
                    mapToEditPanelValues: (config) => new Map([
                        ["system_title", config.system_title || defaultConfig.system_title],
                        ["teacher_button_text", config.teacher_button_text || defaultConfig.teacher_button_text],
                        ["admin_button_text", config.admin_button_text || defaultConfig.admin_button_text]
                    ])
                });
            }
        }

        function showScreen(screenId) {
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('teacher-screen').classList.add('hidden');
            document.getElementById('admin-screen').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        function showTab(tabId, buttonId, tabClass, buttonClass) {
            document.querySelectorAll(`.${tabClass}`).forEach(tab => tab.classList.add('hidden'));
            document.querySelectorAll(`.${buttonClass}`).forEach(btn => {
                btn.classList.remove('border-green-500', 'text-green-600', 'border-blue-500', 'text-blue-600');
                btn.classList.add('border-transparent', 'text-gray-500');
            });
            
            document.getElementById(tabId).classList.remove('hidden');
            const button = document.getElementById(buttonId);
            button.classList.remove('border-transparent', 'text-gray-500');
            if (buttonClass === 'tab-button') {
                button.classList.add('border-green-500', 'text-green-600');
            } else {
                button.classList.add('border-blue-500', 'text-blue-600');
            }
        }

        function generateId() {
            return Date.now().toString() + Math.random().toString(36).substr(2, 9);
        }

        function setLoading(loading) {
            isLoading = loading;
            const forms = document.querySelectorAll('form');
            forms.forEach(form => {
                if (loading) {
                    form.classList.add('loading');
                } else {
                    form.classList.remove('loading');
                }
            });
        }

        function getStandardScore(subject, testType) {
            const standards = allData.filter(item => item.type === 'standard' && item.subject === subject);
            if (standards.length === 0) return null;
            
            const standard = standards[0];
            switch (testType) {
                case 'pre_test': return standard.standard_pre_test;
                case 'first_improvement': return standard.standard_first_improvement;
                case 'second_improvement': return standard.standard_second_improvement;
                case 'third_improvement': return standard.standard_third_improvement;
                default: return null;
            }
        }

        function getAchievementStatus(score, standardScore) {
            if (score === null || score === undefined || standardScore === null || standardScore === undefined) {
                return { status: '미실시', class: '' };
            }
            return score >= standardScore ? 
                { status: '도달', class: 'achievement-pass' } : 
                { status: '미도달', class: 'achievement-fail' };
        }

        async function saveImprovementData(formData) {
            if (currentRecordCount >= 999) {
                showMessage("최대 999개의 기록만 저장할 수 있습니다. 일부 기록을 삭제한 후 다시 시도해주세요.");
                return;
            }

            setLoading(true);
            const improvement = formData.post_score - formData.pre_score;
            
            const record = {
                id: generateId(),
                type: 'improvement',
                student_name: formData.student_name,
                grade: formData.grade,
                class: formData.class,
                student_number: formData.student_number,
                subject: formData.subject,
                pre_score: formData.pre_score,
                post_score: formData.post_score,
                improvement: improvement,

        function renderStudentTable() {
            const tbody = document.getElementById('student-table-body');
            const studentData = allData.filter(item => item.type === 'student');
            
            tbody.innerHTML = '';
            studentData.forEach(item => {
                const improvementResults = allData.filter(imp => 
                    imp.type === 'improvement' && 
                    imp.student_name === item.student_name &&
                    imp.grade === item.grade &&
                    imp.class === item.class &&
                    imp.student_number === item.student_number
                );

                const testResults = allData.filter(test => 
                    test.type === 'test' && 
                    test.student_name === item.student_name &&
                    test.grade === item.grade &&
                    test.class === item.class &&
                    test.student_number === item.student_number
                );
                
                let resultText = '미실시';
                const results = [];
                
                if (improvementResults.length > 0) {
                    results.push(...improvementResults.map(r => `향상도(${r.subject}): ${r.improvement > 0 ? '+' : ''}${r.improvement}점`));
                }
                
                if (testResults.length > 0) {
                    testResults.forEach(test => {
                        const testResultTexts = [];
                        if (test.pre_test_score) {
                            const standard = getStandardScore(test.subject, 'pre_test');
                            const status = getAchievementStatus(test.pre_test_score, standard);
                            testResultTexts.push(`사전검사: ${status.status}`);
                        }
                        if (test.first_improvement_score) {
                            const standard = getStandardScore(test.subject, 'first_improvement');
                            const status = getAchievementStatus(test.first_improvement_score, standard);
                            testResultTexts.push(`1차: ${status.status}`);
                        }
                        if (test.second_improvement_score) {
                            const standard = getStandardScore(test.subject, 'second_improvement');
                            const status = getAchievementStatus(test.second_improvement_score, standard);
                            testResultTexts.push(`2차: ${status.status}`);
                        }
                        if (test.third_improvement_score) {
                            const standard = getStandardScore(test.subject, 'third_improvement');
                            const status = getAchievementStatus(test.third_improvement_score, standard);
                            testResultTexts.push(`3차: ${status.status}`);
                        }
                        if (testResultTexts.length > 0) {
                            results.push(`${test.subject}(${testResultTexts.join(', ')})`);
                        }
                    });
                }
                
                if (results.length > 0) {
                    resultText = results.join(' | ');
                }
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="border border-gray-300 px-3 py-2 text-sm">${item.student_name}</td>
                    <td class="border border-gray-300 px-3 py-2 text-sm">${item.grade}학년 ${item.class}반 ${item.student_number}번</td>
                    <td class="border border-gray-300 px-3 py-2 text-sm">${item.support_type}</td>
                    <td class="border border-gray-300 px-3 py-2 text-sm">${item.support_period}</td>
                    <td class="border border-gray-300 px-3 py-2 text-sm">${resultText}</td>
                    <td class="border border-gray-300 px-3 py-2 text-sm">${item.notes}</td>
                    <td class="border border-gray-300 px-3 py-2 text-sm">
                        <button onclick="deleteRecord(${JSON.stringify(item).replace(/"/g, '&quot;')})" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-xs">삭제</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }
